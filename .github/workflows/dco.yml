name: dco

# CONTRIBUTING.md asks for a Signed-off-by line on every commit. This reads commit metadata only;
# it checks out no pull-request code and holds no secret.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dco-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a matching sign-off on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys
          base, head = os.environ["BASE"], os.environ["HEAD"]
          commits = subprocess.check_output(
              ["git", "rev-list", "--reverse", f"{base}..{head}"], text=True
          ).splitlines()
          failed = False
          for commit in commits:
              author, body = subprocess.check_output(
                  ["git", "show", "-s", "--format=%an <%ae>%n%B", commit], text=True
              ).split("\n", 1)
              signoffs = re.findall(r"(?im)^Signed-off-by:\s*(.+?)\s*$", body)
              if author.casefold() not in {value.casefold() for value in signoffs}:
                  print(f"{commit[:12]}: no Signed-off-by line matching the author {author}", file=sys.stderr)
                  failed = True
          if failed:
              sys.exit("Add the line with `git commit -s`; see CONTRIBUTING.md.")
          print(f"sign-off verified on {len(commits)} commit(s)")
          PY
