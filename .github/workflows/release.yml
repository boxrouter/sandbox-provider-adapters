name: release

# One release per merge that changes a provider. The tag is the version. Only the release App may
# create or move `v*` tags (ruleset `release tags`), so the tag step uses the App's token.
on:
  push:
    branches: [main]
    paths: ["providers/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Token for this repo (tags and release) and Cloud (repin dispatch)
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.BOXROUTER_APP_ID }}
          private-key: ${{ secrets.BOXROUTER_APP_PRIVATE_KEY }}
          owner: boxrouter
          repositories: |
            sandbox-providers
            cloud
      - name: Build the release files
        run: uv run --locked python scripts/release.py build --out dist
      - name: Tag and publish the release
        id: tag
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          git fetch --tags --force origin
          tag=$(uv run --locked python scripts/release.py next-tag)
          git tag "$tag" "$SHA"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$tag"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$tag" --notes "Provider release $tag at $SHA." dist/*
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Dispatch Cloud's repin
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh workflow run repin.yml --repo boxrouter/cloud \
            -f repo=boxrouter/sandbox-providers -f tag="$TAG"
