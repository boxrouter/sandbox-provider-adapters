name: checks

on:
  pull_request:

permissions:
  contents: read

# The newest push to a pull request supersedes the run still checking the old head.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Static provider checks
        run: uv run --locked python scripts/check_provider.py --base "origin/$BASE_REF"
      - name: Offline tests of each changed provider
        run: |
          set -eu
          providers=$(git diff --name-only "origin/$BASE_REF...HEAD" \
            | sed -n 's|^providers/\([^/_][^/]*\)/.*|\1|p' | sort -u)
          for p in $providers; do
            [ -d "providers/$p" ] || continue
            uv run --locked --project "providers/$p" pytest "providers/$p/tests" -q
          done
