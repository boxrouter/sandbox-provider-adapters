[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "sps-provider-blaxel"
version = "0.3.0"
description = "Blaxel as a Sandbox Provider Spec 1.0 provider"
readme = "README.md"
license = "LicenseRef-PolyForm-Shield-1.0.0"
requires-python = ">=3.11"
dependencies = [
    "sandbox-provider-spec",
    "httpx>=0.28.1,<0.29",
    "websockets>=16.1.1,<17",
]

[project.entry-points."sandbox_provider_spec.providers"]
blaxel = "sps_provider_blaxel:BlaxelProvider"

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.uv.sources]
sandbox-provider-spec = { path = "vendor/sandbox_provider_spec-0.5.62-py3-none-any.whl" }

[tool.hatch.build.targets.wheel]
packages = ["src/sps_provider_blaxel"]

# The prober's discovery snapshot travels inside the wheel: Cloud installs wheels, and reads a served
# provider's routing facts, abilities and regions from it (`provider_traits._snapshot_path`).
[tool.hatch.build.targets.wheel.force-include]
"reports/prober-discovery.json" = "sps_provider_blaxel/reports/prober-discovery.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
tmp_path_retention_policy = "failed"
markers = [
    "integration: a test that talks to a server on this machine",
    "loopback: a test that opens a connection to 127.0.0.1",
]

[tool.ruff]
target-version = "py311"
line-length = 100
