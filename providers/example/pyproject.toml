[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "sps-provider-example"
version = "0.3.3"
description = "The template provider adapter: a 1.0 Provider over Example Cloud"
readme = "README.md"
license = "LicenseRef-PolyForm-Shield-1.0.0"
requires-python = ">=3.11"
dependencies = [
    "sandbox-provider-spec",
    "httpx==0.28.1",
    "websockets==16.1.1",
]

[project.entry-points."sandbox_provider_spec.providers"]
example = "sps_provider_example:ExampleProvider"

[dependency-groups]
dev = [
    "pytest==9.1.1",
]
# To run the fake backend and the tester; not part of the wheel or the allowlist.
tools = [
    "sandbox-provider-spec[http]",
    "docker==7.2.0",
]

[tool.uv.sources]
sandbox-provider-spec = { path = "vendor/sandbox_provider_spec-0.5.86-py3-none-any.whl" }

[tool.hatch.build.targets.wheel]
packages = ["src/sps_provider_example"]

[tool.ruff]
target-version = "py311"
line-length = 100
