[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "sps-provider-groundbox"
version = "0.1.0"
description = "A Sandbox Provider Spec 1.0 adapter for Groundbox"
readme = "README.md"
license = "LicenseRef-PolyForm-Shield-1.0.0"
requires-python = ">=3.11"
dependencies = [
    "sandbox-provider-spec",
    "httpx==0.28.1",
]

[project.entry-points."sandbox_provider_spec.providers"]
groundbox = "sps_provider_groundbox:GroundboxProvider"

[dependency-groups]
dev = [
    "pytest==9.1.1",
]
# To run the tester; not part of the wheel or the allowlist.
tools = [
    "sandbox-provider-spec[http]",
]

[tool.uv.sources]
sandbox-provider-spec = { path = "vendor/sandbox_provider_spec-0.5.86-py3-none-any.whl" }

[tool.hatch.build.targets.wheel]
packages = ["src/sps_provider_groundbox"]

[tool.ruff]
target-version = "py311"
line-length = 100
