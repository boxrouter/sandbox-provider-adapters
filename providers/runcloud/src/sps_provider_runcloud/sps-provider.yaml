provider_id: runcloud
name: run.cloud
spec_version: "1.1"
credential_fields:
  - name: api_key
    secret: true
    description: "API key from the run.cloud dashboard (Settings, API keys)"
  - name: endpoint
    secret: false
    required: false
    default: "https://api.run.cloud"
    description: "run.cloud API base URL"
api_domains: [api.run.cloud, api-dev.run.cloud]
